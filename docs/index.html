<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor EE</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1>Gestor EE</h1>
    <p>Estades d'Empresa — introdueix la contrasenya per continuar.</p>
    <form id="login-form" class="login-form">
      <input id="login-password" type="password" placeholder="Contrasenya" autocomplete="current-password" autofocus>
      <button type="submit" class="btn-primary">Entra</button>
    </form>
    <p id="login-error" class="error-text hidden"></p>
  </div>
</div>

<div id="app-shell" class="app-shell hidden">

  <header class="app-header">
    <span class="app-title">Gestor EE</span>
    <span class="user-email"></span>
    <button id="logout-btn" class="btn-link">Tanca sessió</button>
  </header>

  <nav class="app-nav">
    <button class="nav-btn active" data-section="dashboard">
      <span class="nav-icon">🏠</span><span>Dashboard</span>
    </button>
    <button class="nav-btn" data-section="excel">
      <span class="nav-icon">📊</span><span>Excel oficial</span>
    </button>
    <button class="nav-btn" data-section="correus">
      <span class="nav-icon">✉️</span><span>Enviar correus</span>
    </button>
  </nav>

  <main class="app-main">

    <section id="section-dashboard" class="app-section active">
      <div id="dashboard-no-sheet" class="notice hidden">
        Encara no hi ha cap Google Sheets configurat. Ves a <strong>Excel oficial</strong> i enganxa l'enllaç.
      </div>
      <div id="dashboard-tiles" class="tiles-grid"></div>
      <div class="dashboard-students-header">
        <h2>Alumnat</h2>
        <input id="dashboard-cerca-alumne" type="text" class="wizard-search hidden" placeholder="🔎 Cerca alumne/a per nom...">
      </div>
      <div id="dashboard-students" class="student-list"></div>
    </section>

    <section id="section-excel" class="app-section">
      <div class="sheet-link-box">
        <label for="sheet-link-input">Enllaç del Google Sheets oficial</label>
        <div class="sheet-link-row">
          <input id="sheet-link-input" type="url" placeholder="https://docs.google.com/spreadsheets/d/...">
          <button id="sheet-link-save" class="btn-primary">Desa</button>
        </div>
        <p id="sheet-link-status" class="hint-text"></p>
      </div>

      <div id="excel-no-sheet" class="notice hidden">Enganxa i desa l'enllaç del Sheet per veure'n les dades.</div>

      <div id="excel-grid-wrap" class="hidden">
        <div class="table-scroll">
          <table id="excel-table" class="excel-table"></table>
        </div>
      </div>
    </section>

    <section id="section-correus" class="app-section">
      <div class="sheet-link-box">
        <label for="correus-sheet-link-input">Enllaç del Google Sheets d'enviament de correus</label>
        <div class="sheet-link-row">
          <input id="correus-sheet-link-input" type="url" placeholder="https://docs.google.com/spreadsheets/d/...">
          <button id="correus-sheet-link-save" class="btn-primary">Desa</button>
        </div>
        <p id="correus-sheet-link-status" class="hint-text"></p>
      </div>

      <div id="correus-no-sheet" class="notice hidden">Enganxa i desa l'enllaç del Sheet d'enviament de correus.</div>

      <div id="correus-toolbar" class="correus-toolbar hidden">
        <button id="correus-programats-btn" class="btn-link">📅 Veure correus programats</button>
      </div>

      <div id="correus-wizard" class="hidden"></div>
    </section>

  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/excel.js"></script>
<script src="js/correus.js"></script>
<script src="js/app.js"></script>
</body>
</html>
